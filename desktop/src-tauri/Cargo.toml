[package]
name = "clearsign-desktop"
description = "ClearSign — see what a transaction really does before you approve it."
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clearsign = { path = "../../signing-core/crates/clearsign", features = ["std"] }
clearsign-safe-json = { path = "../../signing-core/crates/clearsign-safe-json" }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# GTK3 requires glib 0.18. See ../vendor/README.md for the upstream backport.
glib = { path = "../vendor/glib-0.18.5" }
