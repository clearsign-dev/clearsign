[package]
name = "clearsign-desktop"
description = "Before you sign — a desktop window onto what a transaction actually does."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clearsign = { path = "../../signing-core/crates/clearsign", features = ["std"] }
clearsign-safe-json = { path = "../../signing-core/crates/clearsign-safe-json" }

[lints.rust]
unsafe_code = "forbid"
