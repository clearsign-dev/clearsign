[package]
name = "clearsign-bench"
description = "Benchmarks, and checks of clearsign against real transactions from many chains. Never part of any signer build."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not part of the main workspace, like fuzz/: the benchmark needs alloy, its
# RPC types and a gzip reader, and none of that belongs in the product's
# lockfile or near the reproducible build.
[workspace]
members = ["."]

[dependencies]
clearsign = { path = "../crates/clearsign", features = ["std"] }
clearsign-safe-json = { path = "../crates/clearsign-safe-json" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
alloy-consensus = { version = "2", features = ["std", "k256", "serde"] }
alloy-eips = { version = "2", features = ["std", "serde"] }
alloy-primitives = { version = "1", features = ["std", "k256", "serde"] }
alloy-rpc-types-eth = { version = "2", features = ["std", "serde"] }
alloy-sol-types = { version = "1", features = ["std", "eip712-serde"] }

[profile.release]
debug = false
codegen-units = 1
lto = true
