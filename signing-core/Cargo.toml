[workspace]
resolver = "2"
members = [
    "crates/clearsign",
    "crates/clearsign-keys",
    "crates/clearsign-cli",
    "crates/clearsign-difftest",
    "crates/authority",
    "crates/authority-agent",
    "crates/clearsign-ffi",
    "crates/clearsign-qr",
    "crates/clearsign-device",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
debug = false
incremental = false
