[package]
name = "clearsign-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
clearsign = { path = "../crates/clearsign", features = ["std"] }
clearsign-qr = { path = "../crates/clearsign-qr", features = ["std"] }
authority = { path = "../crates/authority", features = ["std"] }
clearsign-safe-json = { path = "../crates/clearsign-safe-json" }

# Not part of the main workspace: fuzzing needs nightly, the product does not.
[workspace]
members = ["."]

[[bin]]
name = "rlp_decode"
path = "fuzz_targets/rlp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_bytes"
path = "fuzz_targets/tx_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_tx"
path = "fuzz_targets/safe_tx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan"
path = "fuzz_targets/plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multisend"
path = "fuzz_targets/multisend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ur_decode"
path = "fuzz_targets/ur_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_wire"
path = "fuzz_targets/plan_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_data"
path = "fuzz_targets/typed_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calldata"
path = "fuzz_targets/calldata.rs"
test = false
doc = false
bench = false
