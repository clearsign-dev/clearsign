[package]
name = "clearsign"
description = "Decode exactly what an EVM or Safe transaction does, from the signed bytes alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
std = []

[dependencies]
# RustCrypto, no_std, no default features.
sha3 = { version = "0.10", default-features = false }
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
# RUSTSEC-2026-0387 is fixed in 0.7.6. Keep this bound beside every direct
# k256 consumer so secondary workspaces cannot resolve the vulnerable 0.7.5.
crypto-bigint = { version = ">=0.7.6, <0.8", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# INV-7: the decoder must never panic on any input. Enforced statically.
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
