[package]
name = "clearsign-device"
description = "The signer as the whole userland: process 1 of a Linux image that contains nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clearsign-device"
path = "src/main.rs"

[dependencies]
clearsign = { path = "../clearsign", features = ["std"] }
clearsign-keys = { path = "../clearsign-keys", features = ["std"] }
clearsign-qr = { path = "../clearsign-qr", features = ["std"] }
qrcodegen = "1.8"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# This program is process 1 of the signer image: if it panics, the kernel panics.
# It carries the same no-panic lints as the decoder itself.
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
