[package]
name = "clearsign-safe-json"
description = "Reading a Safe transaction from the JSON a signer already has, and deciding which domain it belongs to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clearsign = { path = "../clearsign", features = ["std"] }
serde_json = "1"
serde = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
