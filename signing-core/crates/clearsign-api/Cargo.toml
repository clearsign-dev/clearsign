[package]
name = "clearsign-api"
description = "Stable structured API for embedding the ClearSign transaction reviewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clearsign = { path = "../clearsign", features = ["std"] }
clearsign-safe-json = { path = "../clearsign-safe-json" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
