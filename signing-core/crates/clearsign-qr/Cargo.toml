[package]
name = "clearsign-qr"
description = "Air-gapped QR transport: Uniform Resources (BCR-2020-005/012, BCR-2024-001) and EIP-4527 Ethereum signing requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
std = ["clearsign/std"]

[dependencies]
# Borrowed, audited implementations only. SHA-256 seeds the fountain PRNG.
sha2 = { version = "0.10", default-features = false }
clearsign = { path = "../clearsign" }

[dev-dependencies]
clearsign = { path = "../clearsign", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The QR reader parses input handed over by an untrusted computer. INV-7.
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
