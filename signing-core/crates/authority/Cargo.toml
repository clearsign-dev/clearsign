[package]
name = "authority"
description = "Plans, information-flow tracing, risk review and approval-bound execution for actions proposed by AI agents or apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
std = ["clearsign/std"]

[dependencies]
clearsign = { path = "../clearsign" }

[dev-dependencies]
clearsign = { path = "../clearsign", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
