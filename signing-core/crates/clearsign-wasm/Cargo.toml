[package]
name = "clearsign-wasm"
description = "The reviewer, compiled for a browser, so the whole review runs on the machine looking at it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clearsign = { path = "../clearsign", features = ["std"] }
clearsign-safe-json = { path = "../clearsign-safe-json" }
serde_json = "1"

[lints.rust]
# This crate is the boundary with JavaScript, so it needs pointers. It is the
# only place in the project apart from the seL4 bridge that does.
unsafe_code = "allow"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
