[package]
name = "clearsign-cli"
description = "Command-line front end for clearsign. No network access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clearsign"
path = "src/main.rs"

[dependencies]
clearsign-safe-json = { path = "../clearsign-safe-json" }
clearsign = { path = "../clearsign", features = ["std"] }
clearsign-keys = { path = "../clearsign-keys", features = ["std"] }
clearsign-qr = { path = "../clearsign-qr", features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Borrowed QR encoder: Nayuki's reference implementation, widely reviewed.
qrcodegen = "1.8"
# Reading the JSON a signer already has, rather than asking them to retype it.
serde_json = "1"

[dev-dependencies]
clearsign-qr = { path = "../clearsign-qr", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
