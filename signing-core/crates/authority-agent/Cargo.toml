[package]
name = "authority-agent"
description = "Adapter between an AI agent's tool calls and the authority engine: propose, review, approve, then run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "authority"
path = "src/main.rs"

[lib]
name = "authority_agent"
path = "src/lib.rs"

[dependencies]
authority = { path = "../authority" }
clearsign = { path = "../clearsign", features = ["std"] }
# Borrowed, ubiquitous JSON parser. It runs on the host side only; the trusted
# core parses the typed wire format, not JSON.
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
