[package]
name = "clearsign-difftest"
description = "Differential tests of clearsign against alloy. Test-only: never part of any signer build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
clearsign = { path = "../clearsign", features = ["std"] }
alloy-consensus = { version = "2", default-features = false, features = ["std"] }
alloy-eips = { version = "2", default-features = false, features = ["std"] }
alloy-primitives = { version = "1", features = ["std"] }
alloy-sol-types = { version = "1", features = ["std", "eip712-serde"] }
alloy-dyn-abi = { version = "1", default-features = false, features = ["std", "eip712"] }
clearsign-safe-json = { path = "../clearsign-safe-json" }
serde_json = "1"
proptest = "1"
