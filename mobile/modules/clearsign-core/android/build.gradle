plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.clearsign.core'
version = '0.1.0'

android {
  namespace "dev.clearsign.core"
  sourceSets {
    main {
      jniLibs.srcDirs += ["${projectDir}/../native/android"]
    }
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
