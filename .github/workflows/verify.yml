# What a second machine checks, if this repository is ever pushed.
#
# The point of job `reproducible` is the one thing this project cannot prove on
# its own hardware: that somebody else's machine, with a different operating
# system, CPU architecture and toolchain installation, builds the same bytes
# from the same source. It compares against signing-core/EXPECTED-HASHES.txt,
# which is produced by scripts/reproducible-cross-check.sh and committed.
#
# Nothing here publishes anything. It builds, tests and compares.
#
# Actions are pinned to commit hashes, not tags. A tag is a name its owner can
# move, and these actions run with the repository checked out — the threat model
# lists the supply chain as an adversary, and a mutable reference in the one place
# that verifies everything else would be an odd thing to leave.
name: verify

on:
  # Branches are covered by the pull_request trigger. Without this, every push to
  # a branch with an open PR runs the whole suite twice, and the reproducible
  # build alone takes about twenty minutes a time.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests, lints and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain
        working-directory: signing-core
        run: rustup show          # rust-toolchain.toml pins the version
      - name: Tests
        working-directory: signing-core
        run: cargo test --workspace --release --locked
      - name: Lints
        working-directory: signing-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Formatting
        working-directory: signing-core
        run: cargo fmt --all --check

  window:
    name: the window still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the pinned toolchain
        working-directory: signing-core
        run: rustup show
      - name: Build the page
        # The smoke test runs as part of this, and fails the build if the page
        # that comes out does not work. A page that parses is not a page that
        # works: a constant used in three places and declared in none got past
        # every other check here and shipped.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: app/build.sh
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  no-std:
    name: builds without an operating system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Run inside signing-core so rust-toolchain.toml applies: adding a target
      # to the default toolchain does not add it to the pinned one.
      - name: Add the bare-metal targets to the pinned toolchain
        working-directory: signing-core
        run: rustup target add aarch64-unknown-none thumbv7em-none-eabihf
      - name: Bare-metal targets
        working-directory: signing-core
        run: |
          for t in aarch64-unknown-none thumbv7em-none-eabihf; do
            cargo build -p clearsign --release --locked --target "$t"
            cargo build -p clearsign-keys --release --locked --target "$t"
            cargo build -p clearsign-qr --release --locked --target "$t"
            cargo build -p authority --release --locked --target "$t"
          done

  reproducible:
    name: same source, same bytes, another machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Allow the arm64 canonical image to run here
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Fetch the crate sources named by Cargo.lock
        working-directory: signing-core
        run: cargo fetch --locked
      - name: Keep the recorded hashes so they can be compared afterwards
        run: cp signing-core/EXPECTED-HASHES.txt /tmp/recorded.txt
      - name: Build twice in the canonical environment
        # The script fails on its own if the two builds disagree, which is the
        # reproducibility claim. It rewrites EXPECTED-HASHES.txt on success.
        run: SKIP_HOST_BUILD=1 signing-core/scripts/reproducible-cross-check.sh
      - name: Compare with the recorded hashes
        run: |
          set -euo pipefail
          # Two separate questions. The first — do two builds in the canonical
          # environment agree? — is the reproducibility claim, and the step above
          # already failed if they did not.
          #
          # The second is whether EXPECTED-HASHES.txt still describes this source.
          # That file is a release artifact: it exists so somebody can check a
          # binary they were given. Every commit that touches the code makes it
          # stale, which is normal and not a defect, so on a branch this is a
          # notice. It is only an error on a release tag, where the recorded
          # hashes have to be the hashes of what is being released.
          if diff -u /tmp/recorded.txt signing-core/EXPECTED-HASHES.txt; then
            echo "This machine reproduced the recorded binaries exactly."
            exit 0
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            echo "::error::signing-core/EXPECTED-HASHES.txt does not describe this release."
            echo "The build reproduced here, so this is not a reproducibility failure: the"
            echo "recorded hashes are stale. Regenerate them before tagging:"
            echo ""
            echo "    signing-core/scripts/reproducible-cross-check.sh"
            exit 1
          fi
          echo "::notice::The build reproduced here, and signing-core/EXPECTED-HASHES.txt is now stale."
          echo "That is expected on a branch that changes the code. Regenerate it before release:"
          echo ""
          echo "    signing-core/scripts/reproducible-cross-check.sh"

  fuzz-smoke:
    name: short fuzzing run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz every parser briefly
        working-directory: signing-core
        run: |
          for target in rlp_decode tx_bytes safe_tx multisend plan ur_decode; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -max_len=4096
          done
