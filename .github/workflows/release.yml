# Build the reviewing tool for the machines people actually have, and attach the
# binaries to a release with their hashes.
#
# Only `clearsign` is released. The signing and seed commands inside it stay
# behind the development guard, and the device binary is not something anyone
# should download and run on a laptop.
#
# One of these artifacts is reproducible: aarch64-unknown-linux-musl, built in
# the canonical environment, whose hashes are recorded in
# signing-core/EXPECTED-HASHES.txt. The others are built by GitHub's runners and
# cannot be checked that way, which the release notes say plainly.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release_manifest.py check-version "${GITHUB_REF_NAME}" "${GITHUB_REF_TYPE}"
          node --test app/backend-desktop.test.mjs
      - name: Test the source being released
        working-directory: signing-core
        run: |
          cargo test --workspace --release --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all --check

  build:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin }
          # Also built on Apple Silicon. macos-13 was GitHub's Intel image and
          # has been retired, so a job asking for it waits for a runner that no
          # longer exists — it queued for 42 minutes and would have queued for
          # ever. Rust cross-compiles this target from arm64 without help, and
          # neither macOS build was ever reproducible, so nothing is lost.
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Add the target to the pinned toolchain
        working-directory: signing-core
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: signing-core
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          SOURCE_DATE_EPOCH: '0'
        run: cargo build -p clearsign-cli --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: signing-core
        run: |
          set -euo pipefail
          name="clearsign-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/clearsign" "dist/$name/"
          cp ../docs/06-using-it-before-you-sign.md "dist/$name/README.md"
          cp ../LICENSE-MIT ../LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: signing-core/dist/*.tar.gz*

  reproducible:
    needs: validate
    # aarch64-unknown-linux-musl is the one artifact the release notes ask people
    # to verify, so it has to be built the way the verification instructions say:
    # in the canonical container, offline, with the paths remapped out. Built on
    # a bare runner instead it is a different binary, and the instructions fail
    # for everyone who follows them.
    name: aarch64-unknown-linux-musl (canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Allow the arm64 canonical image to run here
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Fetch the crate sources named by Cargo.lock
        working-directory: signing-core
        run: cargo fetch --locked
      - name: Build in the canonical environment
        run: |
          cp signing-core/EXPECTED-HASHES.txt /tmp/committed-hashes.txt
          SKIP_HOST_BUILD=1 ARTIFACTS=/tmp/repro signing-core/scripts/reproducible-cross-check.sh
          diff -u /tmp/committed-hashes.txt signing-core/EXPECTED-HASHES.txt
      - name: Package the canonical binary
        run: |
          set -euo pipefail
          name=clearsign-aarch64-unknown-linux-musl
          mkdir -p "signing-core/dist/$name"
          cp /tmp/repro/one-clearsign "signing-core/dist/$name/clearsign"
          chmod +x "signing-core/dist/$name/clearsign"
          cp docs/06-using-it-before-you-sign.md "signing-core/dist/$name/README.md"
          cp LICENSE-MIT LICENSE-APACHE "signing-core/dist/$name/"
          tar -C signing-core/dist -czf "signing-core/dist/$name.tar.gz" "$name"
          shasum -a 256 "signing-core/dist/$name.tar.gz" > "signing-core/dist/$name.tar.gz.sha256"
          # The hash people actually compare against EXPECTED-HASHES.txt is the
          # binary's, not the archive's. Publish both and say which is which.
          ( cd "signing-core/dist/$name" && shasum -a 256 clearsign ) \
            | sed 's|$| (binary, compare with signing-core/EXPECTED-HASHES.txt)|' \
            > signing-core/dist/BINARY-SHA256
          cat signing-core/dist/BINARY-SHA256
          diff <(awk '{print $1}' signing-core/dist/BINARY-SHA256) \
               <(awk '/  clearsign$/{print $1}' /tmp/committed-hashes.txt) \
            || { echo "::error::the packaged binary is not the one EXPECTED-HASHES.txt describes" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-unknown-linux-musl
          path: |
            signing-core/dist/*.tar.gz*
            signing-core/dist/BINARY-SHA256

  publish:
    needs: [build, reproducible, desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect the hashes
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py manifest dist "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}"
          ( cd dist && sha256sum --check SHA256SUMS )
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The section of CHANGELOG.md for this tag leads the notes. Somebody
          # on the Releases page should be able to see what they are getting and
          # what staying put costs them, without opening the repository.
          if awk -v tag="## ${GITHUB_REF_NAME} " '
                index($0, tag) == 1 { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md > changes.md && [ -s changes.md ]; then
            cat changes.md > notes.md
            printf '\n---\n\n' >> notes.md
          else
            echo "::warning::CHANGELOG.md has no section for ${GITHUB_REF_NAME}."
            : > notes.md
          fi
          cat >> notes.md <<'NOTES'
          A tool for reading a Safe transaction before you approve it. It holds no
          keys and signs nothing.

          The decoder never opens a socket. Paste a transaction and nothing
          leaves the machine. The one feature that does reach the network is
          fetching a queued transaction by its hash, which contacts Safe's
          transaction service and nothing else.

          Start with `README.md` in the archive, or
          `docs/06-using-it-before-you-sign.md` in the repository.

              clearsign safe-json tx.json --chain-id 1

          **What is checked, and what is not.** This has had one external security
          review: ten findings, all fixed. The fixes have not been reviewed by
          anyone outside the project. `docs/03-verification-status.md` lists what
          is proven and what is not, including the gaps.

          **Reproducibility.** The `aarch64-unknown-linux-musl` build is the one
          you can check, and it is built here the same way you would rebuild it:
          in the canonical container, with build paths remapped out and the
          compile itself offline from a copied registry cache. The container's
          own bootstrap is not offline — it installs three packages with apt and
          downloads rustup, neither pinned by digest — so the environment is
          named and reproducible in practice rather than sealed.
          Rebuild it with `signing-core/scripts/reproducible-cross-check.sh` and
          compare against `signing-core/EXPECTED-HASHES.txt`.

          Compare the **binary**, not the archive. `BINARY-SHA256` attached here
          is the binary's hash; `SHA256SUMS` covers the archives, which include a
          README and the licences and so hash differently. The checksum list also
          covers every installer, the standalone HTML page and build metadata.

          The macOS and x86_64 builds are produced by GitHub's runners and are
          not reproducible in that sense — rustc does not promise identical
          output across compiler hosts, and this project would rather say so than
          imply otherwise.

          **The application is not signed yet.** macOS and Windows will warn that
          it comes from an unidentified developer, because it does: signing
          certificates are a paid registration this project has not taken out.
          Until then the honest check is the hash, not the badge.

          **Not for real keys.** The signing and seed commands stay behind a
          development guard. Anything typed into an everyday computer should be
          treated as exposed.
          NOTES
          # The installers were being built for three platforms and then thrown
          # away: only the tarballs were ever attached.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/clearsign.html dist/SHA256SUMS dist/BINARY-SHA256 dist/BUILD-METADATA.json \
            $(ls dist/*.dmg dist/*.msi dist/*.exe dist/*.deb dist/*.AppImage 2>/dev/null || true)

  # The installers. One job per platform, because each one is built by the
  # operating system it installs onto.
  desktop:
    needs: validate
    name: app for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Add the WebAssembly target
        working-directory: signing-core
        run: rustup target add wasm32-unknown-unknown
      - name: The application's version must match the tag
        # v0.1.1 shipped installers named ClearSign_0.1.0_*, and the app's own
        # build_info reported 0.1.0, because the version lives in three files
        # and none of them are the tag. A release that names itself wrong is a
        # release nobody can reason about.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for f in desktop/package.json desktop/src-tauri/tauri.conf.json; do
            got=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' "$f" | head -1)
            [ "$got" = "$want" ] || { echo "::error::$f says $got, tag says $want" >&2; exit 1; }
          done
          got=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          [ "$got" = "$want" ] || { echo "::error::Cargo.toml says $got, tag says $want" >&2; exit 1; }
          echo "the application calls itself $want, and so does the tag"

      - name: Build the front end from the shared template
        # Windows runners default to PowerShell, which ran this without running
        # it: the step passed in a second, built nothing, and Tauri then failed
        # looking for a front end that was never generated. Git Bash is present
        # on all three runners, so say which shell rather than take the default.
        shell: bash
        run: app/build.sh
      - name: Check the front end is actually there
        # The failure above was not that a step errored; it was that a step
        # passed without doing anything, and the error surfaced two steps later
        # as a confusing message from Tauri. Assert the artifact exists.
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop/src/index.html \
            || { echo "app/build.sh did not produce desktop/src/index.html" >&2; exit 1; }
          echo "front end: $(wc -c < desktop/src/index.html) bytes"
      - name: Build the application
        working-directory: desktop
        run: |
          npm ci
          npm run build -- -- --locked
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-dist
          find desktop/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} desktop-dist/ \;
          test -n "$(find desktop-dist -type f -print -quit)" \
            || { echo "::error::no installers were produced" >&2; exit 1; }
          if [ "${{ runner.os }}" = Linux ]; then
            cp app/dist/clearsign.html desktop-dist/
          fi
          ls -la desktop-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.os }}
          path: desktop-dist/*
