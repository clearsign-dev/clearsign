# Build the reviewing tool for the machines people actually have, and attach the
# binaries to a release with their hashes.
#
# Only `clearsign` is released. The signing and seed commands inside it stay
# behind the development guard, and the device binary is not something anyone
# should download and run on a laptop.
#
# One of these artifacts is reproducible: aarch64-unknown-linux-musl, built in
# the canonical environment, whose hashes are recorded in
# signing-core/EXPECTED-HASHES.txt. The others are built by GitHub's runners and
# cannot be checked that way, which the release notes say plainly.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: release validation
    runs-on: ubuntu-24.04
    outputs:
      release_mode: ${{ steps.release_policy.outputs.release_mode }}
      apple_team_id: ${{ steps.release_policy.outputs.apple_team_id }}
      windows_certificate_thumbprint: ${{ steps.release_policy.outputs.windows_certificate_thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate and freeze the release policy
        id: release_policy
        env:
          CLEARSIGN_RELEASE_MODE: ${{ vars.CLEARSIGN_RELEASE_MODE }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          policy=$(python3 scripts/release_manifest.py release-policy \
            "${GITHUB_REF_TYPE}" "$CLEARSIGN_RELEASE_MODE" \
            "$APPLE_TEAM_ID" "$WINDOWS_CERTIFICATE_THUMBPRINT")
          {
            echo "release_mode=$(jq -r .releaseMode <<< "$policy")"
            echo "apple_team_id=$(jq -r .appleTeamId <<< "$policy")"
            echo "windows_certificate_thumbprint=$(jq -r .windowsCertificateThumbprint <<< "$policy")"
          } >> "$GITHUB_OUTPUT"
      - name: Validate release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release_manifest.py check-version "${GITHUB_REF_NAME}" "${GITHUB_REF_TYPE}"
          node --test app/backend-desktop.test.mjs
      - name: Audit dependency lockfiles
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo tree --locked --manifest-path desktop/src-tauri/Cargo.toml --edges normal,build >/dev/null
          # Alloy retains its disabled k256 backend in these lockfiles. Audit
          # may ignore that optional package only while Cargo proves it is not
          # reachable in the configured graphs.
          test -z "$(cargo tree --locked --target all --manifest-path signing-core/Cargo.toml -i crypto-bigint@0.5.5 2>/dev/null)"
          test -z "$(cargo tree --locked --target all --manifest-path signing-core/bench/Cargo.toml -i crypto-bigint@0.5.5 2>/dev/null)"
          cargo audit --file signing-core/Cargo.lock --deny unsound --ignore RUSTSEC-2026-0387
          cargo audit --file signing-core/bench/Cargo.lock --deny unsound --ignore RUSTSEC-2026-0387
          cargo audit --file signing-core/fuzz/Cargo.lock --deny unsound
          cargo audit --file desktop/src-tauri/Cargo.lock --deny unsound
      - name: Verify and test the Linux desktop dependency backport
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          curl --fail --location --retry 3 https://static.crates.io/crates/glib/glib-0.18.5.crate -o /tmp/glib.crate
          python3 scripts/check_glib_backport.py /tmp/glib.crate
          cargo test --release --locked --manifest-path desktop/vendor/glib-0.18.5/Cargo.toml --lib variant_iter::tests
      - name: Test the source being released
        working-directory: signing-core
        run: |
          cargo test --workspace --release --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all --check

  build:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin }
          # Also built on Apple Silicon. macos-13 was GitHub's Intel image and
          # has been retired, so a job asking for it waits for a runner that no
          # longer exists — it queued for 42 minutes and would have queued for
          # ever. Rust cross-compiles this target from arm64 without help, and
          # neither macOS build was ever reproducible, so nothing is lost.
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the target to the pinned toolchain
        working-directory: signing-core
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: signing-core
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          SOURCE_DATE_EPOCH: '0'
        run: cargo build -p clearsign-cli --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: signing-core
        run: |
          set -euo pipefail
          name="clearsign-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/clearsign" "dist/$name/"
          cp ../docs/06-using-it-before-you-sign.md "dist/$name/README.md"
          cp ../LICENSE-MIT ../LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: signing-core/dist/*.tar.gz*

  reproducible:
    needs: validate
    # aarch64-unknown-linux-musl is the one artifact the release notes ask people
    # to verify, so it has to be built the way the verification instructions say:
    # in the canonical container, offline, with the paths remapped out. Built on
    # a bare runner instead it is a different binary, and the instructions fail
    # for everyone who follows them.
    name: aarch64-unknown-linux-musl (canonical)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allow the arm64 canonical image to run here
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Fetch the crate sources named by Cargo.lock
        working-directory: signing-core
        run: cargo fetch --locked
      - name: Build in the canonical environment
        run: |
          cp signing-core/EXPECTED-HASHES.txt /tmp/committed-hashes.txt
          SKIP_HOST_BUILD=1 ARTIFACTS=/tmp/repro signing-core/scripts/reproducible-cross-check.sh
          cp signing-core/EXPECTED-HASHES.txt /tmp/candidate-hashes.txt
      - name: Require recorded hashes for a tag
        run: |
          set -euo pipefail
          if diff -u /tmp/committed-hashes.txt signing-core/EXPECTED-HASHES.txt; then
            echo "The canonical build reproduced the recorded binaries exactly."
            exit 0
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = tag ]; then
            echo "::error::signing-core/EXPECTED-HASHES.txt does not describe this release." >&2
            echo "Regenerate and review the hashes before tagging." >&2
            exit 1
          fi
          echo "::notice::Canonical builds agree; EXPECTED-HASHES.txt is stale for this branch candidate."
          echo "A tag remains blocked until the separate release-hash update is reviewed."
      - name: Package the canonical binary
        run: |
          set -euo pipefail
          name=clearsign-aarch64-unknown-linux-musl
          mkdir -p "signing-core/dist/$name"
          cp /tmp/repro/one-clearsign "signing-core/dist/$name/clearsign"
          chmod +x "signing-core/dist/$name/clearsign"
          cp docs/06-using-it-before-you-sign.md "signing-core/dist/$name/README.md"
          cp LICENSE-MIT LICENSE-APACHE "signing-core/dist/$name/"
          tar -C signing-core/dist -czf "signing-core/dist/$name.tar.gz" "$name"
          shasum -a 256 "signing-core/dist/$name.tar.gz" > "signing-core/dist/$name.tar.gz.sha256"
          # The hash people actually compare against EXPECTED-HASHES.txt is the
          # binary's, not the archive's. Publish both and say which is which.
          ( cd "signing-core/dist/$name" && shasum -a 256 clearsign ) \
            | sed 's|$| (canonical binary hash)|' \
            > signing-core/dist/BINARY-SHA256
          cat signing-core/dist/BINARY-SHA256
          diff <(awk '{print $1}' signing-core/dist/BINARY-SHA256) \
               <(awk '/  clearsign$/{print $1}' /tmp/candidate-hashes.txt) \
            || { echo "::error::the packaged binary differs from the canonical build output" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-unknown-linux-musl
          path: |
            signing-core/dist/*.tar.gz*
            signing-core/dist/BINARY-SHA256

  artifacts:
    needs: [validate, build, reproducible, desktop]
    name: validate complete release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate the SPDX software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/ClearSign.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate the complete artifact set before any tag is needed
        env:
          CLEARSIGN_RELEASE_MODE: ${{ needs.validate.outputs.release_mode }}
          APPLE_TEAM_ID: ${{ needs.validate.outputs.apple_team_id }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ needs.validate.outputs.windows_certificate_thumbprint }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')
          python3 scripts/release_manifest.py manifest dist "$version" "${GITHUB_SHA}" "${GITHUB_REF_TYPE}" \
            "$CLEARSIGN_RELEASE_MODE" "$APPLE_TEAM_ID" "$WINDOWS_CERTIFICATE_THUMBPRINT"
          python3 scripts/release_manifest.py verify dist "$version" "${GITHUB_SHA}" "${GITHUB_REF_TYPE}" \
            "$CLEARSIGN_RELEASE_MODE" "$APPLE_TEAM_ID" "$WINDOWS_CERTIFICATE_THUMBPRINT"
      - name: Attest the release candidate's build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/*

  signer-image:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    name: signer image matches its recorded hashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allow the arm64 canonical image to run here
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Fetch the crate sources named by Cargo.lock
        working-directory: signing-core
        run: cargo fetch --locked
      - name: Rebuild twice and require the recorded image hashes
        run: |
          set -euo pipefail
          cp platform/signer-image/EXPECTED-HASHES.txt /tmp/recorded-signer-image-hashes.txt
          platform/signer-image/check-reproducible.sh
          if ! diff -u /tmp/recorded-signer-image-hashes.txt platform/signer-image/EXPECTED-HASHES.txt; then
            echo "::error::platform/signer-image/EXPECTED-HASHES.txt does not describe this release." >&2
            echo "Regenerate it before tagging:" >&2
            echo "" >&2
            echo "    platform/signer-image/check-reproducible.sh" >&2
            exit 1
          fi

  publish:
    needs: [validate, artifacts, signer-image]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist
      - name: Verify the validated candidate without rewriting it
        env:
          CLEARSIGN_RELEASE_MODE: ${{ needs.validate.outputs.release_mode }}
          APPLE_TEAM_ID: ${{ needs.validate.outputs.apple_team_id }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ needs.validate.outputs.windows_certificate_thumbprint }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py verify dist "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}" tag \
            "$CLEARSIGN_RELEASE_MODE" "$APPLE_TEAM_ID" "$WINDOWS_CERTIFICATE_THUMBPRINT"
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLEARSIGN_RELEASE_MODE: ${{ needs.validate.outputs.release_mode }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py check-mode tag "$CLEARSIGN_RELEASE_MODE"
          : > notes.md
          if [ "$CLEARSIGN_RELEASE_MODE" = unsigned-evaluation ]; then
            cat >> notes.md <<'WARNING'
          **Unsigned evaluation release. Not approved for high-value custody.**

          The macOS and Windows artifacts in this prerelease are deliberately not
          publisher-signed or notarized. Their checksums and GitHub build provenance
          authenticate bytes only after you establish trust in this repository and
          workflow; they do not authenticate ClearSign as the platform publisher.

          ---

          WARNING
          fi
          # The section of CHANGELOG.md for this tag leads the notes. Somebody
          # on the Releases page should be able to see what they are getting and
          # what staying put costs them, without opening the repository.
          if awk -v tag="## ${GITHUB_REF_NAME} " '
                index($0, tag) == 1 { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md > changes.md && [ -s changes.md ]; then
            cat changes.md >> notes.md
            printf '\n---\n\n' >> notes.md
          else
            echo "::warning::CHANGELOG.md has no section for ${GITHUB_REF_NAME}."
          fi
          cat >> notes.md <<'NOTES'
          A tool for reading a Safe transaction before you approve it. It holds no
          keys and signs nothing.

          The decoder never opens a socket. Paste a transaction and nothing
          leaves the machine. The one feature that does reach the network is
          fetching a queued transaction by its hash, which contacts Safe's
          transaction service and nothing else.

          Start with `README.md` in the archive, or
          `docs/06-using-it-before-you-sign.md` in the repository.

              clearsign safe-json tx.json --chain-id 1

          **What is checked, and what is not.** This has had one external security
          review: ten findings, all fixed. The fixes have not been reviewed by
          anyone outside the project. `docs/03-verification-status.md` lists what
          is proven and what is not, including the gaps.

          **Reproducibility.** The `aarch64-unknown-linux-musl` build is the one
          you can check, and it is built here the same way you would rebuild it:
          in the canonical container, with build paths remapped out and the
          compile itself offline from a copied registry cache. The container's
          own bootstrap is not offline — it installs three packages with apt and
          downloads rustup, neither pinned by digest — so the environment is
          named and reproducible in practice rather than sealed.
          Rebuild it with `signing-core/scripts/reproducible-cross-check.sh` and
          compare against `signing-core/EXPECTED-HASHES.txt`.

          Compare the **binary**, not the archive. `BINARY-SHA256` attached here
          is the binary's hash; `SHA256SUMS` covers the archives, which include a
          README and the licences and so hash differently. The checksum list also
          covers every installer, the standalone HTML page and build metadata.

          The macOS and x86_64 builds are produced by GitHub's runners and are
          not reproducible in that sense — rustc does not promise identical
          output across compiler hosts, and this project would rather say so than
          imply otherwise.

          NOTES
          if [ "$CLEARSIGN_RELEASE_MODE" = signed ]; then
            cat >> notes.md <<'SIGNED'
          **Publisher authentication.** The macOS application and DMG are signed
          with a Developer ID certificate, accepted by Apple's notarization
          service and stapled. The Windows application, MSI and NSIS installer
          carry an Authenticode signature and trusted timestamp. Linux packages
          are not platform-signed; use `SHA256SUMS` and the GitHub build-provenance
          attestation. `BUILD-METADATA.json` records these platform differences.
          SIGNED
          else
            cat >> notes.md <<'UNSIGNED'
          **Publisher authentication.** This is the explicitly selected unsigned
          evaluation mode. The macOS and Windows artifacts have no platform
          publisher signature or notarization. Use `SHA256SUMS`, inspect
          `BUILD-METADATA.json`, and verify the GitHub build-provenance attestation.
          UNSIGNED
          fi
          cat >> notes.md <<'NOTES'

          **Not for real keys.** The signing and seed commands stay behind a
          development guard. Anything typed into an everyday computer should be
          treated as exposed.
          NOTES
          # The installers were being built for three platforms and then thrown
          # away: only the tarballs were ever attached.
          # Upload into a draft first. When immutable releases are enabled, the
          # final publication locks the complete asset set and tag together.
          release_flags=(--draft)
          if [ "$CLEARSIGN_RELEASE_MODE" = unsigned-evaluation ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${release_flags[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/clearsign.html dist/SHA256SUMS dist/BINARY-SHA256 dist/BUILD-METADATA.json dist/ClearSign.spdx.json \
            $(ls dist/*.dmg dist/*.msi dist/*.exe dist/*.deb dist/*.AppImage 2>/dev/null || true)
          gh release edit "${GITHUB_REF_NAME}" --draft=false

  # The installers. One job per platform, because each one is built by the
  # operating system it installs onto.
  desktop:
    needs: validate
    name: app for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb libfuse2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Add the WebAssembly target
        working-directory: signing-core
        run: rustup target add wasm32-unknown-unknown
      - name: The application's version must match the tag
        # v0.1.1 shipped installers named ClearSign_0.1.0_*, and the app's own
        # build_info reported 0.1.0, because the version lives in three files
        # and none of them are the tag. A release that names itself wrong is a
        # release nobody can reason about.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for f in desktop/package.json desktop/src-tauri/tauri.conf.json; do
            got=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' "$f" | head -1)
            [ "$got" = "$want" ] || { echo "::error::$f says $got, tag says $want" >&2; exit 1; }
          done
          got=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          [ "$got" = "$want" ] || { echo "::error::Cargo.toml says $got, tag says $want" >&2; exit 1; }
          echo "the application calls itself $want, and so does the tag"

      - name: Build the front end from the shared template
        # Windows runners default to PowerShell, which ran this without running
        # it: the step passed in a second, built nothing, and Tauri then failed
        # looking for a front end that was never generated. Git Bash is present
        # on all three runners, so say which shell rather than take the default.
        shell: bash
        run: app/build.sh
      - name: Check the front end is actually there
        # The failure above was not that a step errored; it was that a step
        # passed without doing anything, and the error surfaced two steps later
        # as a confusing message from Tauri. Assert the artifact exists.
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop/src/index.html \
            || { echo "app/build.sh did not produce desktop/src/index.html" >&2; exit 1; }
          echo "front end: $(wc -c < desktop/src/index.html) bytes"
      - name: Prepare macOS Developer ID signing and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.release_mode == 'signed'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ needs.validate.outputs.apple_team_id }}
        run: |
          set -euo pipefail
          python3 scripts/release_signing.py check-env macos
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] \
            || { echo "::error::APPLE_TEAM_ID must be 10 uppercase letters or digits" >&2; exit 1; }

          certificate="$RUNNER_TEMP/clearsign-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          python3 - "$certificate" "$api_key" <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys

          Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True))
          Path(sys.argv[2]).write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"], validate=True))
          PY
          chmod 600 "$certificate" "$api_key"

          keychain="$RUNNER_TEMP/clearsign-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          previous_keychain=$(security default-keychain -d user | tr -d '"')
          {
            echo "CLEARSIGN_KEYCHAIN_PATH=$keychain"
            echo "CLEARSIGN_PREVIOUS_KEYCHAIN=$previous_keychain"
          } >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$previous_keychain"
          security default-keychain -d user -s "$keychain"

          identities=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')
          count=$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')
          [ "$count" = 1 ] || {
            echo "::error::expected exactly one Developer ID Application identity, found $count" >&2
            exit 1
          }

          {
            echo "APPLE_SIGNING_IDENTITY=$identities"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Prepare Windows Authenticode signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.release_mode == 'signed'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ needs.validate.outputs.windows_certificate_thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/release_signing.py check-env windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing credentials are incomplete' }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'clearsign-code-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $signingCertificates = @($imported | Where-Object {
            $_.HasPrivateKey -and
            ($_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')
          })
          if ($signingCertificates.Count -ne 1) {
            throw "Expected one imported certificate with a private key, found $($signingCertificates.Count)"
          }
          $certificate = $signingCertificates[0]
          $expectedThumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($certificate.Thumbprint -ne $expectedThumbprint) {
            throw 'Imported Windows certificate does not match WINDOWS_CERTIFICATE_THUMBPRINT'
          }
          if ($certificate.NotAfter -le (Get-Date).ToUniversalTime()) {
            throw 'Windows code-signing certificate is expired'
          }
          if ($certificate.NotBefore -gt (Get-Date).ToUniversalTime()) {
            throw 'Windows code-signing certificate is not valid yet'
          }
          Add-Content $env:GITHUB_ENV "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)"

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }
          $config = 'desktop/src-tauri/tauri.windows-signing.generated.json'
          python scripts/release_signing.py windows-config $config $certificate.Thumbprint $timestampUrl
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the Windows signing configuration' }
          Add-Content $env:GITHUB_ENV "TAURI_SIGNING_CONFIG=src-tauri/tauri.windows-signing.generated.json"
      - name: Build the application
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ -n "${TAURI_SIGNING_CONFIG:-}" ]; then
            npm run build -- --config "$TAURI_SIGNING_CONFIG" -- --locked
          else
            npm run build -- -- --locked
          fi
      - name: Verify macOS signature, notarization and stapling
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.release_mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          images=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#apps[@]}" = 1 ] && [ "${#images[@]}" = 1 ] \
            || { echo "::error::expected one macOS app and one DMG" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --verify --verbose=2 "${images[0]}"
          team_id=$(codesign -d --verbose=4 "${apps[0]}" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ "$team_id" = "$APPLE_TEAM_ID" ] \
            || { echo "::error::macOS app has unexpected TeamIdentifier: $team_id" >&2; exit 1; }
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${images[0]}"
      - name: Verify the evaluation macOS artifacts have no publisher identity
        if: runner.os == 'macOS' && needs.validate.outputs.release_mode != 'signed'
        shell: bash
        run: |
          set -euo pipefail
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          images=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#apps[@]}" = 1 ] && [ "${#images[@]}" = 1 ] \
            || { echo "::error::expected one macOS app and one DMG" >&2; exit 1; }
          app_details="$RUNNER_TEMP/clearsign-app-signature.txt"
          if codesign -d --verbose=4 "${apps[0]}" >"$app_details" 2>&1; then
            # Current Apple linkers add an identity-free ad-hoc signature even
            # when no signing certificate is configured. It is not publisher
            # authentication, so accept it only after proving that it has no
            # team identifier or certificate authority.
            python3 scripts/release_signing.py check-macos-adhoc "$app_details"
          elif ! grep -Fq 'code object is not signed at all' "$app_details"; then
            cat "$app_details" >&2
            echo "::error::could not classify the macOS application signature" >&2
            exit 1
          fi

          image_details="$RUNNER_TEMP/clearsign-dmg-signature.txt"
          if codesign -d --verbose=4 "${images[0]}" >"$image_details" 2>&1; then
            cat "$image_details" >&2
            echo "::error::unsigned-evaluation DMG contains a code signature" >&2
            exit 1
          elif ! grep -Fq 'code object is not signed at all' "$image_details"; then
            cat "$image_details" >&2
            echo "::error::could not classify the macOS DMG signature" >&2
            exit 1
          fi

          if spctl --assess --type execute "${apps[0]}" >/dev/null 2>&1; then
            echo "::error::Gatekeeper accepted an unsigned-evaluation application" >&2
            exit 1
          fi
          for path in "${apps[0]}" "${images[0]}"; do
            if xcrun stapler validate "$path" >/dev/null 2>&1; then
              echo "::error::unsigned-evaluation artifact has a stapled ticket: $path" >&2
              exit 1
            fi
          done
      - name: Install and launch the macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          images=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [ "${#images[@]}" = 1 ] || { echo "::error::expected one DMG" >&2; exit 1; }
          mount_plist="$RUNNER_TEMP/clearsign-dmg-mount.plist"
          hdiutil attach -nobrowse -readonly -plist "${images[0]}" > "$mount_plist"
          mount_point=$(python3 - "$mount_plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as stream:
              entities = plistlib.load(stream)["system-entities"]
          points = [entity["mount-point"] for entity in entities if "mount-point" in entity]
          if len(points) != 1:
              raise SystemExit(f"expected one mounted volume, found {len(points)}")
          print(points[0])
          PY
          )
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          apps=("$mount_point"/*.app)
          [ "${#apps[@]}" = 1 ] || { echo "::error::expected one app in DMG" >&2; exit 1; }
          installed="$RUNNER_TEMP/Applications/ClearSign.app"
          mkdir -p "$(dirname "$installed")"
          ditto "${apps[0]}" "$installed"
          executables=("$installed"/Contents/MacOS/*)
          [ "${#executables[@]}" = 1 ] && [ -x "${executables[0]}" ] \
            || { echo "::error::installed app has no unique executable" >&2; exit 1; }
          "${executables[0]}" > "$RUNNER_TEMP/clearsign-macos.log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/clearsign-macos.log"
            echo "::error::installed macOS application exited during startup" >&2
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Verify Windows Authenticode signatures and timestamps
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.release_mode == 'signed'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'desktop/src-tauri/target/release/clearsign-desktop.exe'
          )
          $paths += @(Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName)
          $paths += @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          if ($paths.Count -ne 3) { throw "Expected three signed Windows files, found $($paths.Count)" }
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on ${path}: $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNING_THUMBPRINT) {
              throw "Unexpected signer certificate on ${path}"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing trusted timestamp on ${path}"
            }
          }
      - name: Verify the evaluation Windows artifacts are unsigned
        if: runner.os == 'Windows' && needs.validate.outputs.release_mode != 'signed'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('desktop/src-tauri/target/release/clearsign-desktop.exe')
          $paths += @(Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName)
          $paths += @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          if ($paths.Count -ne 3) { throw "Expected three unsigned Windows files, found $($paths.Count)" }
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned evaluation artifact has unexpected signature status on ${path}: $($signature.Status)"
            }
          }
      - name: Install the native UI test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Install and test the Debian package
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i desktop/src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a node desktop/installed-smoke.mjs /usr/bin/clearsign-desktop
      - name: Launch and test the AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Remove the installed copy so this check cannot accidentally use it.
          package=$(dpkg-deb --field desktop/src-tauri/target/release/bundle/deb/*.deb Package)
          sudo dpkg -r "$package"
          test ! -e /usr/bin/clearsign-desktop
          images=(desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          xvfb-run -a node desktop/installed-smoke.mjs "${images[0]}"
      - name: Install and test the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Assert-ReleaseSignature([string]$Path) {
            $signature = Get-AuthenticodeSignature $Path
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) {
              if ($signature.Status -ne 'NotSigned') {
                throw "Unsigned evaluation file has unexpected signature status on ${Path}: $($signature.Status)"
              }
              return
            }
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNING_THUMBPRINT -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "Installed file is not validly signed and timestamped: $Path"
            }
          }
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Edge driver helper installation failed' }
          msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { throw 'Edge driver download failed' }
          $env:PATH = "$PWD;$env:PATH"
          # Elevated WebView2 hosts ignore environment-based debugging flags.
          # Scope the documented machine-policy override to this test app, and
          # restore it even if the test fails. Nothing is added to the installer.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $appName = 'clearsign-desktop.exe'
          $previous = if (Test-Path $policy) { (Get-ItemProperty $policy).PSObject.Properties[$appName] } else { $null }
          $previousValue = if ($null -ne $previous) { $previous.Value } else { $null }
          New-Item -Path $policy -Force | Out-Null
          try {
            New-ItemProperty -Path $policy -Name $appName -PropertyType String -Value '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1' -Force | Out-Null
            # Start with MSI on the clean runner, before NSIS can leave a saved
            # install-directory preference for WiX's AppSearch to discover.
            $msi = @(Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi)
            if ($msi.Count -ne 1) { throw 'Expected one MSI installer' }
            $msiDestination = Join-Path $env:RUNNER_TEMP 'clearsign-msi-installed'
            if (Test-Path $msiDestination) { throw 'MSI test requires a fresh destination' }
            $msiLog = Join-Path $env:RUNNER_TEMP 'clearsign-msi-install.log'
            $arguments = @('/i', "`"$($msi[0].FullName)`"", '/qn', '/norestart', "INSTALLDIR=`"$msiDestination`"", '/L*v', "`"$msiLog`"")
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path "$msiDestination/clearsign-desktop.exe")) {
              Get-Content $msiLog -Tail 100
              throw "MSI did not install the expected executable (exit $($process.ExitCode))"
            }
            Assert-ReleaseSignature "$msiDestination/clearsign-desktop.exe"
            node desktop/installed-smoke.mjs "$msiDestination/clearsign-desktop.exe"
            if ($LASTEXITCODE -ne 0) { throw 'MSI application failed its smoke test' }
            $process = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi[0].FullName)`"", '/qn', '/norestart' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI uninstall failed: $($process.ExitCode)" }
            if (Test-Path "$msiDestination/clearsign-desktop.exe") { throw 'MSI application remains installed' }

            $installer = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe)
            if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
            $destination = Join-Path $env:RUNNER_TEMP 'clearsign-installed'
            $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
            Assert-ReleaseSignature "$destination/clearsign-desktop.exe"
            node desktop/installed-smoke.mjs "$destination/clearsign-desktop.exe"
            if ($LASTEXITCODE -ne 0) { throw 'NSIS application failed its smoke test' }
            $uninstaller = Join-Path $destination 'uninstall.exe'
            Assert-ReleaseSignature $uninstaller
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$destination" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed: $($process.ExitCode)" }
            if (Test-Path "$destination/clearsign-desktop.exe") { throw 'NSIS application remains installed' }
          } finally {
            if ($null -ne $previous) {
              Set-ItemProperty -Path $policy -Name $appName -Value $previousValue
            } else {
              Remove-ItemProperty -Path $policy -Name $appName -ErrorAction SilentlyContinue
            }
          }
      - name: Collect the installers
        # Keep failed candidates available for diagnosis, but the failed desktop
        # job still blocks the artifacts and publish jobs.
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-dist
          find desktop/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} desktop-dist/ \;
          test -n "$(find desktop-dist -type f -print -quit)" \
            || { echo "::error::no installers were produced" >&2; exit 1; }
          if [ "${{ runner.os }}" = Linux ]; then
            cp app/dist/clearsign.html desktop-dist/
          fi
          ls -la desktop-dist
      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set +e
          if [ -n "${CLEARSIGN_PREVIOUS_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$CLEARSIGN_PREVIOUS_KEYCHAIN"
            security list-keychains -d user -s "$CLEARSIGN_PREVIOUS_KEYCHAIN"
          fi
          if [ -n "${CLEARSIGN_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$CLEARSIGN_KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP"/clearsign-developer-id.p12 "$RUNNER_TEMP"/AuthKey_*.p8
      - name: Remove imported Windows signing certificate
        if: always() && runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$($env:WINDOWS_SIGNING_THUMBPRINT)" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item "$env:RUNNER_TEMP\clearsign-code-signing.pfx" -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop/src-tauri/tauri.windows-signing.generated.json' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: app-${{ matrix.os }}
          path: desktop-dist/*
