# Pinned for the whole repository, not only the signer workspace.
#
# Anything outside signing-core — the desktop application, a script run from the
# root — otherwise picks up whatever cargo happens to be on PATH. That has
# already cost two debugging sessions: once in CI, where targets were installed
# into a different toolchain than the one building, and once here, where a 2024
# cargo could not read a 2024-edition manifest. One pin, applied everywhere.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
